  <circle cx="34" cy="84" r="3" fill="#34D399" />
  <circle cx="66" cy="84" r="3" fill="#34D399" />
  <line x1="37" y1="83" x2="47" y2="81" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.8" />
  <line x1="53" y1="81" x2="63" y2="83" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.8" />
